# Compila el instalador de Windows al subir un tag vX.Y.Z (lo hace `make release`), lo adjunta al
# release y lo publica cuando termina bien. Si algo falla, el release queda en borrador y se puede
# relanzar el workflow desde la pestaña Actions. El instalador no va firmado (sin firma de código)
# y la app no tiene actualizador: no hay llaves, secretos ni latest.json.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}
  TAG: ${{ github.ref_name }}

jobs:
  prepare:
    name: Preparar release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: La versión del tag coincide con la de la app
        run: |
          app=$(sed -n 's/^  "version": "\(.*\)",$/\1/p' tauri.conf.json)
          [[ "v$app" == "$TAG" ]] || { echo "::error::tauri.conf.json dice $app y el tag es $TAG"; exit 1; }
      - name: Crear el release en borrador si aún no existe
        run: |
          gh release view "$TAG" >/dev/null 2>&1 && exit 0
          bash scripts/changelog-notes.sh "${TAG#v}" | gh release create "$TAG" --draft --verify-tag \
            --title "Signal Aduana $TAG" --notes-file -

  build:
    name: Instalador (Windows)
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # La CLI de Tauri por npx trae binarios precompilados (cargo install tardaría ~10 min).
      # Solo se usa aquí; la UI sigue sin npm.
      - name: Compilar
        shell: bash
        run: npx --yes @tauri-apps/cli@2 build

      # Nombre fijo, así releases/latest/download/Signal-Aduana-windows-x64-setup.exe siempre
      # apunta a la última versión.
      - name: Subir al release
        shell: bash
        run: |
          mkdir -p dist
          f=$(find target -type f -path '*/release/bundle/nsis/*' -name '*-setup.exe' | head -1)
          [[ -n $f ]] || { echo "::error::no se generó el instalador NSIS (*-setup.exe)"; exit 1; }
          cp "$f" dist/Signal-Aduana-windows-x64-setup.exe
          ls -l dist
          gh release upload "$TAG" dist/* --clobber

  publish:
    name: Publicar
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Publicar el release
        run: gh release edit "$TAG" --draft=false --latest
